# Prevent udev SDIO-vendor auto-modprobe of aic8800 at boot.
#
# wifi-driver-load.service runs wifi-driver-load.sh, which tries
# rk915 first and falls back to aic8800 only if rk915 fails to bind.
# Without this blacklist, udev sees SDIO vendor 0xc8a1 (AIC8800D80)
# and concurrently modprobes aic8800_bsp/_fdrv while rk915's probe
# is still retrying with rockchip_wifi_power() cycles -- the power
# cycles stomp aic8800's firmware download mid-init, leaving wlan0
# missing. The wifi-driver-load.sh script loads aic8800 explicitly
# after rk915 has finished, so the udev autoload is unwanted.
blacklist aic8800_fdrv
blacklist aic8800_bsp
