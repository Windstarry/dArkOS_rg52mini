# Game config for UCUS98653 - God of War: Chains of Olympus
# Heavy title: drop to 1x resolution, underclock the emulated CPU like the
# stock firmware does, and allow auto frameskip to hold game speed.
# NOTE: [CPU]/[Graphics] keys fall back to the global ppsspp.ini, BUT the
# [ControlMapping] section does NOT. Once a per-game config exists, PPSSPP's
# KeyMap::LoadFromIni resets to its hardcoded defaults and only honors a
# [ControlMapping] present *in this file* (it does not inherit controls.ini).
# So this block must duplicate the global controls.ini mapping, or the pad
# face buttons revert to PPSSPP's defaults (A=Cross etc., wrong for our pad).
# Pause binds both devices' codes: 10-198 (rg52mini menu btn) + 10-107
# (rg43h R3), since this file is shared across both devices.
[CPU]
CPUSpeed = 300
[Graphics]
InternalResolution = 1
FrameSkip = 2
FrameSkipType = 0
AutoFrameSkip = True
VSync = False
[ControlMapping]
Up = 10-19
Down = 10-20
Left = 10-21
Right = 10-22
Circle = 10-189,10-4004
Cross = 10-190,10-4006
Square = 10-188,10-4005
Triangle = 10-191,10-4007
Start = 10-197
Select = 10-196
L = 10-193
R = 10-192
An.Up = 10-4003
An.Down = 10-4002
An.Left = 10-4001
An.Right = 10-4000
Pause = 10-198,10-107
